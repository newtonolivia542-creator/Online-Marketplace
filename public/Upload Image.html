<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
</head>
<body>

    <form id="uploadForm">

    <script src="../js/app.js"></script> <!-- Place your script here, at the end of body -->
</body>
</html>
