<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>
<body>

<h1>Admin Control Panel</h1>
<button id="logoutBtn">Logout</button>

<button onclick="window.location.href='admin.html'">Back</button>



<h2>All Orders</h2>

<input
  type="text"
  id="orderSearch"
  class="admin-search-input"
  placeholder="Search orders by product, buyer, seller, or status..."
>

<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Buyer</th>
      <th>Seller</th>
      <th>Purchased At</th>
      <th>Status</th>
      <th>Shipped At</th>
      <th>Delivered At</th>
      <th>Delivery Time</th>
    </tr>
  </thead>
  <tbody id="allOrders"></tbody>
</table>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
