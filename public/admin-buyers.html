<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <title>Buyers | Lesovia Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>
<body>

<h1>Buyers</h1>
<button id="logoutBtn">Logout</button>
<button class="btn btn-secondary admin-back-btn" onclick="window.location.href='admin.html'">Back</button>

<div class="admin-stat-badge">Total Buyers: <span id="totalBuyers">0</span></div>

<input
  type="text"
  id="buyerSearch"
  class="admin-search-input"
  placeholder="Search buyers by name or email..."
>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Account Created</th>
      <th>Orders Placed</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="buyerList"></tbody>
</table>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
