<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <title>Returns &amp; Refunds - Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
  <style>
    /* Hidden until admin.js confirms the correct login/role */
    body { visibility: hidden; }

    .admin-return-card { border:1px solid var(--lv-line,#E2E8E4); border-radius:12px; padding:16px 18px; margin:14px 0; background:#fff; max-width:900px; }
    .admin-return-card h3 { margin:0 0 4px; }
    .admin-return-card.needs-attention { border-color:#c98a00; box-shadow:0 0 0 2px #f6e2a8; }
    .admin-return-card.highlight { box-shadow:0 0 0 3px var(--lv-green,#0B7A3D); }
    .admin-return-meta { color:#5b6b62; font-size:14px; margin:2px 0 8px; }
    .admin-return-status { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#eef3ef; margin-left:8px; }
    .admin-return-status.attention { background:#fbe9b7; }
    .admin-return-money { background:#f6f8f6; border-radius:8px; padding:8px 12px; font-size:14px; margin:8px 0; }
    .admin-return-actions button { margin:4px 6px 4px 0; }
    .admin-return-history { font-size:13px; color:#5b6b62; margin:8px 0 0; padding-left:18px; }
    .admin-return-error { color:var(--lv-danger,#C6362E); font-size:14px; }
    .admin-return-photos img { width:72px; height:72px; object-fit:cover; border-radius:6px; margin:0 6px 6px 0; }
    .admin-returns-group { margin-top:28px; }
  </style>
</head>
<body>

<div class="admin-topbar">
  <div class="admin-brand">
    <a href="admin.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
      <img src="../images/lesovia-mark.svg" alt="Lesovia" style="width:28px;height:28px;object-fit:contain;">
      <span class="logo-text">Lesovia Admin</span>
    </a>
  </div>

  <div class="admin-topbar-right">
    <button id="logoutBtn" class="btn btn-danger">Logout</button>
  </div>
</div>

<div style="padding:0 24px 40px;">
  <button onclick="window.location.href='admin.html'">Back</button>

  <h2>Returns &amp; Refunds</h2>
  <p>An admin's decision here is final: it overrides the seller's, at any point before a refund is sent.</p>

  <input
    type="text"
    id="returnSearch"
    class="admin-search-input"
    placeholder="Search by order number, buyer, seller, reason, or status..."
  >

  <div id="adminReturns"></div>
</div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
