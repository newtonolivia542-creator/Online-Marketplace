<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<h1>Admin Control Panel</h1>
<button id="logoutBtn">Logout</button>

<h2>All Users</h2>
<table id="userList">
  <thead>
    <tr>
      <th>Email</th>
      <th>Role</th>
    </tr>
  </thead>
  <tbody>
    <!-- Users will be loaded here -->
  </tbody>
</table>

<h2>All Products</h2>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Seller</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="productList"></tbody>
</table>

<h2>All Orders</h2>
<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Buyer</th>
      <th>Seller</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="allOrders"></tbody>
</table>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
