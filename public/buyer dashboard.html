<!DOCTYPE html>
<html>
<head>
  <title>Buyer Dashboard</title>
</head>
<body>
  <header>
    <h2 id="welcome"></h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <input type="text" id="searchInput" placeholder="Search products..." />
<button id="searchBtn">Search</button>
<br><br>

<a href="order.html" style="color:white; background-color: hwb(188 17% 11%); padding: 8px 14px; border:none; cursor:hover; border-radius: 6px;">My Orders</a>
    <button onclick="window.location.href='cart.html'" style="color:white; background-color: hwb(188 17% 11%); padding: 8px 14px; border:none; cursor:hover; border-radius: 6px;">View Cart</button>

<h2>Browse Products</h2>

<select id="categoryFilter">
  <option value="all">All</option>
  <option value="fashion">Fashion</option>
  <option value="electronics">Electronics</option>
  <option value="food">Food</option>
  <option value="home">Home</option>
  <option value="cosmetics">Cosmetics</option>
  <option value="plants">Plants</option>
</select>
  
<div id="productList"></div>

  <main>
    <section class="products-section">
      <h1></h1>
      <div id="productList" class="product-grid"></div>
    </section>

    <div id="productDetailModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:500px; margin: 50px auto; background:#2294c9; padding:20px; border-radius:8px; position:relative;">
        <span id="closeModal" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px;">&times;</span>
        
        <img id="detailImage" src="" alt="Product Image" style="width:100%; max-height:300px; object-fit:cover; margin-bottom:15px;">
        
        <h2 id="detailName"></h2>
        <p id="detailDesc"></p>
        <p><strong>Price: </strong>$<span id="detailPrice"></span></p>
        
        <label for="detailQuantity">Quantity:</label>
        <input type="number" id="detailQuantity" value="1" min="1" style="width:60px; margin-bottom:15px;">

        <button id="addToCartBtn">Add to Cart</button>
      </div>
    </div>
  
<script type="module" src="../js/app.js"></script>
<link rel="stylesheet" href="../css/buyer dashboard.css" />
</body>
</html>
