<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8" />
  <meta name="description" content="Buy affordable electronics, fashion, and more on Lesovia. Trusted multi-vendor marketplace.">
  <!--title>Buyer Dashboard</title -->
  <title>Lesovia Buyer Dashboard</title>

  <meta name="description" content="Buy Cheap Electronics">
  <meta name="description" content="USA newly secure AI Power Commerce">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/footer.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/buyer dashboard.css?v=3" />
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>
<body>
  <header>
 <nav class="navbar">
    <div class="logo">
      <a href="buyer dashboard.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <img src="../images/lesovia-mark.svg" alt="Lesovia">
        <span class="logo-text">Lesovia</span>
      </a>
  </div>
</nav>
    <h2 id="welcome"></h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <input type="text" id="searchInput" placeholder="Search products..." />
<button id="searchBtn">Search</button>

  <input
      id="aiSearchInput"
      placeholder="Ask AI... (Example: I need a laptop under $700 for programming)"
  >

  <button id="aiSearchBtn">
      ✨ AI Search
  </button>
<br><br>

<button class="btn btn-secondary" onclick="window.location.href='order.html'">My Orders</button>
    <button class="btn btn-secondary" onclick="window.location.href='cart.html'">View Cart</button>

    <button class="btn btn-secondary" onclick="window.location.href='messages.html'">
      View Messages
    </button>

    <a
        href="buyer-notifications.html"
        class="notification-btn"
    >
        🔔 Notifications

        <span
            id="notificationBadge"
            class="notification-badge"
            style="display:none;"
        >
            0
        </span>
    </a>


<h2>Browse Products</h2>

<select id="categoryFilter">
  <option value="all">All</option>
  <option value="fashion">Fashion</option>
  <option value="electronics">Electronics</option>
  <option value="food">Food</option>
  <option value="home">Home</option>
  <option value="cosmetics">Cosmetics</option>
  <option value="plants">Plants</option>
</select>
  
<!--div id="productList"></div> -->

<div id="imageGallery"></div>

  <main>
    <section class="products-section">
      <h1></h1>
      <div id="shopResults"></div>
      <div id="productList" class="product-grid"></div>
    </section>

    <div id="productDetailModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:500px; margin: 50px auto; background:#2294c9; padding:20px; border-radius:8px; position:relative;">
        <span id="closeModal" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px;">&times;</span>
        
        <img id="detailImage" src="" alt="Product Image" style="width:100%; max-height:300px; object-fit:cover; margin-bottom:15px;">
        
        <h2 id="detailName"></h2>
        <p id="detailDesc"></p>
        <p><strong>Price: </strong>$<span id="detailPrice"></span></p>
        
        <label for="detailQuantity">Quantity:</label>
        <input type="number" id="detailQuantity" value="1" min="1" style="width:60px; margin-bottom:15px;">

        <!--button id="addToCartBtn">Add to Cart</button-->
      </div>
    </div>
<!--PAYMENT FUNCTION-->
    <div id="checkoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">

      <div style="background:white; width:400px; margin:100px auto; padding:20px; border-radius:10px;">
    
        <h2>Complete Payment</h2>
    
        <div id="card-element"></div>
    
        <button id="payBtn">
          Pay Now
        </button>
    
        <p id="payment-message"></p>
    
        <button id="closeCheckout">
          Cancel
        </button>
    
      </div>
    
    </div>
  
<script type="module" src="../js/app.js"></script>
<script src="https://js.stripe.com/v3/"></script>

<footer class="site-footer">

  <div class="footer-links">

    <a href="seller-agreement.html">Seller Agreement</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
  </div>

  <p>&copy; 2026 Lesovia. All Rights Reserved.</p>

</footer>
</body>
</html>
