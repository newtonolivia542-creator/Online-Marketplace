<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8">
  <title>My Cart - Lesovia</title>
  <link rel="stylesheet" href="../css/buyer dashboard.css">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>
<body>
  <header class="navbar">
    <h2 id="welcome"></h2>
  
    <div class="nav-actions">
      <button id="logoutBtn" style="color: white; background-color: rgb(205, 42, 42);">Logout</button>
      <br>
      <a href="buyer dashboard.html" class="btn btn-secondary">Back To Shop</a>
    </div>
  </header>



  <h1 class="page-title">My Cart</h1>

  <div id="cartControls" style="margin-bottom:10px;">
    <label>
      <input type="checkbox" id="selectAllCheckbox"> Select All
    </label>
  </div>

  <div id="cartItems"></div>
  <ul id="cartList"></ul>

  <div id="cartTotalRow" style="margin:15px 0;">
    <strong>Total: $<span id="cartTotal">0.00</span></strong>
  </div>

  <br>
  <button id="checkoutBtn">Checkout</button>

  <div id="checkoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">

    <div style="background:white; width:400px; margin:100px auto; padding:20px; border-radius:10px;">

      <h2>Complete Payment</h2>

      <div id="card-element"></div>

      <button id="payBtn">
        Pay Now
      </button>

      <p id="payment-message"></p>

      <button id="closeCheckout">
        Cancel
      </button>

    </div>

  </div>

  <script type="module" src="../js/app.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
</body>
</html>
