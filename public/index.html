<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="description"
    content="Lesovia - Buy, sell, and discover products from trusted sellers."
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lesovia | Buy • Sell • Discover</title>

  <link rel="stylesheet" href="../css/buyer dashboard.css?v=2" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="../images/lesovia.svg"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      color: #222;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #111;
      font-size: 24px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-right: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .login-btn {
      background: #0b7a3d;
      color: white !important;
      padding: 10px 18px;
      border-radius: 6px;
    }

    .register-btn {
      border: 1px solid #0b7a3d;
      color: #0b7a3d !important;
      padding: 9px 18px;
      border-radius: 6px;
    }

    /* ================= HERO ================= */

    .hero {
      background: white;
      padding: 60px 5%;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .search-container {
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-container input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .search-container button {
      padding: 15px 25px;
      border: none;
      border-radius: 7px;
      background: #0b7a3d;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    /* ================= CATEGORIES ================= */

    .categories {
      padding: 30px 5%;
      background: #f5f7f9;
    }

    .categories h2 {
      margin-bottom: 20px;
    }

    .category-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .category {
      background: white;
      padding: 15px 25px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e5e5e5;
    }

    /* ================= PRODUCTS ================= */

    .products-section {
      padding: 40px 5%;
    }

    .products-section h2 {
      margin-bottom: 25px;
    }

    #productsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-price {
      color: #0b7a3d;
      font-size: 18px;
      font-weight: bold;
    }

    .product-condition {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 50px;
      padding: 40px 5%;
      background: #111;
      color: white;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .navbar {
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero h1 {
        font-size: 32px;
      }

      .search-container {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

  <!-- ================= NAVIGATION ================= -->

  <nav class="navbar">

    <a href="index.html" class="logo">

      <img
        src="../images/lesovia.svg"
        alt="Lesovia"
      >

      Lesovia

    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="#categories">
        Categories
      </a>

      <h2>Browse Products</h2>

    <select id="categoryFilter">
      <option value="all">All</option>
      <option value="fashion">Fashion</option>
      <option value="electronics">Electronics</option>
      <option value="food">Food</option>
      <option value="home">Home</option>
      <option value="cosmetics">Cosmetics</option>
      <option value="plants">Plants</option>
    </select>


      <a href="login.html" class="login-btn">
        Login
      </a>

      <a href="register.html" class="register-btn">
        Register
      </a>

    </div>

  </nav>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <h1>
      Buy • Sell • Discover
    </h1>

    <p>
      Find products from sellers you can trust.
    </p>

    <div class="search-container">

      <input
        type="text"
        id="searchInput"
        placeholder="What are you looking for?"
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

  </section>


  <!-- ================= CATEGORIES ================= -->


  <select id="categoryFilter">
    <option value="all">All</option>
    <option value="fashion">Fashion</option>
    <option value="electronics">Electronics</option>
    <option value="food">Food</option>
    <option value="home">Home</option>
    <option value="cosmetics">Cosmetics</option>
    <option value="plants">Plants</option>
  </select>

  <section class="products-section">

    <h2>
      Featured Products
    </h2>

    <div id="productList">

        Loading products...

    </div>

  </section>


  <!-- ================= FOOTER ================= -->

  <footer>

    <div>

      <a href="terms.html">
        Terms
      </a>

      <a href="privacy.html">
        Privacy
      </a>

      <a href="seller-agreement.html">
        Seller Agreement
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>

    <p style="margin-top:20px;">
      © 2026 Lesovia. All Rights Reserved.
    </p>

  </footer>


  <!-- Firebase / Existing Application -->

  <script
    type="module"
    src="../js/app.js">
  </script>

</body>

</html>
