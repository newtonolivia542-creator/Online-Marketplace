<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8">

  <meta
    name="description"
    content="Lesovia - Buy, sell, and discover products from trusted sellers."
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lesovia | Buy • Sell • Discover</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lesovia">
  <meta property="og:title" content="Lesovia | Buy • Sell • Discover">
  <meta property="og:description" content="Buy, sell, and discover products from trusted sellers.">
  <meta property="og:image" content="https://lesovia.com/images/lesovia-social.png">
  <meta property="og:url" content="https://lesovia.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lesovia | Buy • Sell • Discover">
  <meta name="twitter:description" content="Buy, sell, and discover products from trusted sellers.">
  <meta name="twitter:image" content="https://lesovia.com/images/lesovia-social.png">

  <link rel="stylesheet" href="../css/buyer dashboard.css?v=2" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="../images/lesovia-mark.svg"
  >
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">

  <style>

    /* Layout only -- colors, fonts, buttons, and .product-card come from
       lesovia.css. This page previously defined its own competing colors
       for all of these, making the homepage look like a different site
       from the dashboards. */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-right: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
    }

    .login-btn {
      background: var(--lv-green);
      color: white !important;
      padding: 10px 18px;
      border-radius: var(--lv-radius-sm);
    }

    .register-btn {
      border: 1px solid var(--lv-green-mist);
      color: white !important;
      padding: 9px 18px;
      border-radius: var(--lv-radius-sm);
    }

    /* ================= HERO ================= */

    .hero {
      background: var(--lv-surface);
      padding: 28px 5% 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--lv-slate);
      font-size: 18px;
      margin-bottom: 30px;
    }

    .search-container {
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-container input {
      flex: 1;
      padding: 15px;
      font-size: 16px;
    }

    .search-container button {
      padding: 15px 25px;
      font-size: 16px;
    }

    /* ================= PRODUCTS ================= */

    .products-section {
      padding: 8px 5% 40px;
    }

    .products-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    .products-header h2 {
      margin-bottom: 0;
    }

    #categoryFilter {
      padding: 8px 12px;
      border: 1px solid var(--lv-line);
      border-radius: var(--lv-radius-sm);
      font-size: 14px;
      background: var(--lv-surface);
      color: var(--lv-ink);
    }

    #productList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .product-card img {
      width: 100%;
      height: 200px;
      background: var(--lv-canvas);
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-condition {
      color: var(--lv-slate);
      font-size: 14px;
      margin-top: 5px;
    }

    /* ================= FOOTER ================= */
    /* Matches footer.css's .site-footer color so every page's footer
       agrees, instead of this page's own separate near-black. */

    footer {
      margin-top: 50px;
      padding: 40px 5%;
      background: #1f2937;
      color: white;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .navbar {
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero h1 {
        font-size: 32px;
      }

      .search-container {
        flex-direction: column;
      }

      .products-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

    }

  </style>

</head>

<body>

  <!-- ================= NAVIGATION ================= -->

  <nav class="navbar">

    <a href="index.html" class="logo">

      <img
        src="../images/lesovia-mark.svg"
        alt="Lesovia"
      >

      <span class="logo-text">Lesovia</span>

    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <!--<a href="#categories">
        Categories
    </a>-->


      <a href="login.html" class="login-btn">
        Login
      </a>

      <a href="register.html" class="register-btn">
        Register
      </a>

    </div>

  </nav>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <h1>
      Buy • Sell • Discover
    </h1>

    <p>
      Find products from sellers you can trust.
    </p>

    <div class="search-container">

      <input
        type="text"
        id="searchInput"
        placeholder="What are you looking for?"
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

  </section>


  <!-- ================= PRODUCTS ================= -->


  <section class="products-section">

    <div class="products-header">

      <h2>
        Featured Products
      </h2>

      <select id="categoryFilter">
        <option value="all">All</option>
        <option value="fashion">Fashion</option>
        <option value="electronics">Electronics</option>
        <option value="food">Food</option>
        <option value="home">Home</option>
        <option value="cosmetics">Cosmetics</option>
        <option value="plants">Plants</option>
      </select>

    </div>

    <div id="shopResults"></div>

    <div id="productList">

        Loading products...

    </div>

  </section>


  <!-- ================= FOOTER ================= -->

  <footer>

    <div>

      <a href="terms.html">
        Terms
      </a>

      <a href="privacy.html">
        Privacy
      </a>

      <a href="seller-agreement.html">
        Seller Agreement
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>

    <p style="margin-top:20px;">
      © 2026 Lesovia. All Rights Reserved.
    </p>

  </footer>


  <!-- Firebase / Existing Application -->

  <script
    type="module"
    src="../js/app.js">
  </script>

</body>

</html>
