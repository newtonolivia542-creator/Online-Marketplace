  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      color: #222;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #111;
      font-size: 24px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-right: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .login-btn {
      background: #0b7a3d;
      color: white !important;
      padding: 10px 18px;
      border-radius: 6px;
    }

    .register-btn {
      border: 1px solid #0b7a3d;
      color: #0b7a3d !important;
      padding: 9px 18px;
      border-radius: 6px;
    }

    /* ================= HERO ================= */

    .hero {
      background: white;
      padding: 60px 5%;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .search-container {
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-container input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .search-container button {
      padding: 15px 25px;
      border: none;
      border-radius: 7px;
      background: #0b7a3d;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    /* ================= CATEGORIES ================= */

    .categories {
      padding: 30px 5%;
      background: #f5f7f9;
    }

    .categories h2 {
      margin-bottom: 20px;
    }

    .category-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .category {
      background: white;
      padding: 15px 25px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #e5e5e5;
    }

    /* ================= PRODUCTS ================= */

    .products-section {
      padding: 40px 5%;
    }

    .products-section h2 {
      margin-bottom: 25px;
    }

    #productsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-price {
      color: #0b7a3d;
      font-size: 18px;
      font-weight: bold;
    }

    .product-condition {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 50px;
      padding: 40px 5%;
      background: #111;
      color: white;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .navbar {
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero h1 {
        font-size: 32px;
      }
