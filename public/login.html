<body>

  <div class="login-page">
  
      <div class="left-panel">
  
          <!--<img src="../images/Lesovia-logo.png"
               class="logo"> -->
  
          <h1>Welcome to Lesovia</h1>
  
          <p>
              AI Powered Marketplace
          </p>
  
          <p>
              Buy • Sell • Discover
          </p>
  
          <p class="small">
              Connecting buyers and sellers worldwide.
          </p>
  
      </div>
  
  
      <div class="right-panel">
  
          <div class="login-card">
  
              <h2>Login</h2>
  
              <form id="loginForm">
  
                  <input
                      id="email"
                      type="email"
                      placeholder="Email"
                      required>
  
                  <input
                      id="password"
                      type="password"
                      placeholder="Password"
                      required>
  
                  <button
                      type="submit"
                      class="btn-primary">
  
                      Login
  
                  </button>
  
              </form>
  
            <button
                id="resetPasswordBtn"
                class="btn-secondary">
                Forgot Password?
            </button>
  
              <p>
  
                  Don't have an account?
  
                  <a href="register.html">
  
                      Register
  
                  </a>
  
                </p>
  
          </div>
  
      </div>
  
  </div>
  
  
  <footer>
  
      <a href="terms.html">Terms</a>
  
      <a href="privacy.html">Privacy</a>
  
      <a href="seller-agreement.html">Seller Agreement</a>
  
      <a href="about.html">About</a>
  
      <a href="contact.html">Contact</a>
  
      <p>
  
          © 2026 Lesovia
  
      </p>
  
  </footer>
  
  <script type="module" src="../js/app.js"></script>
  
  </body>
