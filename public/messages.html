<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Messages</title>
  <link rel="stylesheet" href="../css/buyer dashboard.css">
</head>
<body>
  <header class="navbar">
    <h2 id="welcome"></h2>
  
    <div class="nav-actions">
      <button id="logoutBtn">Logout</button>
      <br>
      <a href="buyer dashboard.html" style="color:white; background-color: hwb(188 17% 11%); padding: 8px 14px; border:none; cursor:hover; border-radius: 6px;">Back To Shop</a>
    </div>
  </header>

  <ul id="buyerMessages"></ul>

  <div id="chatBox" style="display:none; border:1px solid #ccc; padding:15px;">
    <h3 id="chatTitle"></h3>
  
    <div id="chatMessages"></div>
  
    <textarea id="chatInput" placeholder="Type message..."></textarea><br>
  
    <button onclick="sendChatReply()">Send</button>
    <button onclick="deleteCurrentChat()">Delete</button>
    <button onclick="closeChat()">Close</button>
  </div>


  <script type="module" src="../js/app.js"></script>
</body>
</html>
