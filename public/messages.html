<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8">
  <title>My Messages</title>
  <link rel="stylesheet" href="../css/buyer dashboard.css">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>
<body>
  <header class="navbar">
    <h2 id="welcome"></h2>
  
    <div class="nav-actions">
      <button id="logoutBtn">Logout</button>
      <br>
      <a href="buyer dashboard.html" class="btn btn-secondary">Back To Shop</a>
    </div>
  </header>

  <div class="main-wrapper">
    <div class="chat-container"> 
      <h1> Buyer Chats </h1> 
  <ul id="buyerMessages"></ul>
</div>
</div>

  <div id="chatBox" style="display:none; border:1px solid #ccc; padding:15px;">
    <h3 id="chatTitle"></h3>
  
    <div id="chatMessages"></div>
  
    <textarea id="chatInput" placeholder="Type message..."></textarea><br>
  
    <button onclick="sendChatReply()">Send</button>
    <button onclick="deleteCurrentChat()">Delete</button>
    <button onclick="closeChat()">Close</button>
  </div>


  <script type="module" src="../js/app.js"></script>
</body>
</html>
