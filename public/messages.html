<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Messages</title>
  <link rel="stylesheet" href="../css/style.css">
  <a href="buyer dashboard.html" style="color:white; padding:10px 20px; border:none; cursor:hover; width:100%;">Back To Shop</a>
</head>
<body>
  <h1>Messages</h1>

  <ul id="buyerMessages"></ul>

  <button onclick="window.location.href='buyer dashboard.html'">
    Back to Store
  </button>

  <div id="chatBox" style="display:none; border:1px solid #ccc; padding:15px;">
    <h3 id="chatTitle"></h3>
  
    <div id="chatMessages"></div>
  
    <textarea id="chatInput" placeholder="Type message..."></textarea><br>
  
    <button onclick="sendChatReply()">Send</button>
    <button onclick="deleteCurrentChat()">Delete</button>
    <button onclick="closeChat()">Close</button>
  </div>


  <script type="module" src="../js/app.js"></script>
</body>
</html>
