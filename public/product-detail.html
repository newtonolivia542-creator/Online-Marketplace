<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8">
  <title>Product Detail - Lesovia</title>
  <link rel="stylesheet" href="../css/buyer dashboard.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lesovia">
  <meta property="og:title" content="Product Detail - Lesovia">
  <meta property="og:description" content="Buy, sell, and discover products from trusted sellers.">
  <meta property="og:image" content="https://lesovia.com/images/lesovia-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Product Detail - Lesovia">
  <meta name="twitter:image" content="https://lesovia.com/images/lesovia-social.png">
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
</head>
<body>
  <header class="navbar">
    <h2 id="welcome"></h2>
  
    <div class="nav-actions">
      <button id="logoutBtn" style="color: white; background-color: rgb(205, 42, 42);">Logout</button>
      <br>
      <!--<a href="buyer dashboard.html" style="color:white; background-color: hwb(188 17% 11%); padding: 8px 14px; border:none; cursor:hover; border-radius: 6px;">Back To Shop</a>-->
    </div>
  </header>

  <h1 style="text-align: center;">Product Detail</h1>
  <div id="productDetail">

    <!--July 24-->
<!--PAYMENT FUNCTION-->
    <div id="checkoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">

      <div style="background:white; width:400px; margin:100px auto; padding:20px; border-radius:10px;">

        <h2>Complete Payment</h2>

        <div id="card-element"></div>

        <button id="payBtn">
          Pay Now
        </button>

        <p id="payment-message"></p>

        <button id="closeCheckout">
          Cancel
        </button>

      </div>

    </div>


    <div id="imageSlider" class="slider">
      <button id="prevBtn" class="slider-btn left">❮</button>
    
      <img id="detailImage" src="">
    
      <button id="nextBtn" class="slider-btn right">❯</button>
    </div>
    <h2 id="detailName"></h2>
    <div
      id="averageRating"
      class="average-rating">
    </div>
    <p id="detailDesc"></p>
    <p>Price: $<span id="detailPrice"></span></p>

    <h3>Available Colors</h3>
    <div id="colorOptions" class="optionContainer"></div>

    <h3>Available Sizes</h3>
    <div id="sizeOptions" class="optionContainer"></div>

    <p>In Stock:
      <span id="detailQuantityAvailable"></span>
    </p>
    <label for="detailQuantity">Quantity:</label>
    <input type="number" id="detailQuantity" value="1" min="1">
    <br><br>

    <button id="addToCartBtn">Add to Cart</button>
    <button id="buyBtn">
      Buy Now
  </button>

    <h3>Contact Seller</h3>

    <textarea id="messageInput" placeholder="Write a message..." rows="3"></textarea>
    <br><br>
    <button id="sendMessageBtn">Send Message</button>
  </div>
  <div class="reviews-section">
  <!--<h3>Customer Reviews</h3>-->

  <div id="reviewsSummary"></div>

  <div id="reviewsContainer"></div>
</div>


<div class="bottom-actions">

  <button id="backToStoreBtn">
    Back to Store
  </button>

  <button onclick="window.location.href='cart.html'">
    View My Cart
  </button>

</div>

  <script type="module" src="../js/app.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
</body>
</html>
