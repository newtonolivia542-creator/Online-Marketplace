<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
<meta charset="UTF-8">
<title>Leave Review</title>
<link rel="stylesheet" href="../css/seller dashboard.css">
  <style>
    /* Hidden until app.js confirms the correct login/role -- see revealPage() */
    body { visibility: hidden; }
  </style>
</head>

<body>

<h1>Review Product</h1>

<div id="reviewProduct"></div>

<label>Rating</label>

<select id="reviewRating">
  <option value="5">★★★★★</option>
  <option value="4">★★★★☆</option>
  <option value="3">★★★☆☆</option>
  <option value="2">★★☆☆☆</option>
  <option value="1">★☆☆☆☆</option>
</select>

<br><br>

<textarea
  id="reviewComment"
  rows="5"
  placeholder="Write your review">
</textarea>

<br><br>

<button id="submitReviewBtn">
  Submit Review
</button>

<script type="module" src="../js/app.js"></script>

</body>
</html>
