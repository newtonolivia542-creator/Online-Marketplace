<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seller Dashboard - Marketly</title>
  <link rel="stylesheet" href="../css/seller dashboard.css" />
</head>
<body>

  <h1>Seller Dashboard</h1>

    <nav>
        <button id="logoutBtn" style="background-color: hwb(0 30% 8%); color: white; padding: 10px 20px; border: none; cursor: pointer;">Logout</button>
    </nav>
        <a href="seller dashboard.html" style="color:white; background-color: hwb(188 17% 11%); padding: 8px 14px; border:none; cursor:hover; border-radius: 6px;">Back</a>


    <form id="productForm">
      <h2>Upload Products</h2>
      <label for="pName">Product Name</label><br>
      <input type="text" id="pName" placeholder="e.g. Vintage Leather Bag" required style="width: 100%; margin-bottom: 15px;" />
      
      <label for="pPrice">Price ($)</label><br>
      <input type="number" id="pPrice" placeholder="0.00" step="0.01" required style="width: 100%; margin-bottom: 15px;" />

      <label for="quantity">Quantity Available</label><br>
      <input
        type="number"
        id="quantity"
        min="1"
        value="1"
        required
        style="width: 100%; margin-bottom: 15px;"
      />

      <label for="pDesc">Product Description</label><br>

      <textarea
        id="pDesc"
        placeholder="Describe your item..."
        style="width:100%; height:100px; margin-bottom:15px;">
      </textarea>


      <label for="pImage">Image ($)</label><br>
      <label for="pBrand">Brand</label><br>

      <input
          type="text"
          id="pBrand"
          placeholder="Nike, Apple, Samsung, Sony..."
          style="width:100%; margin-bottom:15px;"
      >
      <label for="pCondition">Condition</label><br>

      <select
          id="pCondition"
          style="width:100%; margin-bottom:15px;"
      >
          <option value="New">New</option>
          <option value="Like New">Like New</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Used">Used</option>
      </select>

      <label for="pColors">Colors</label><br>

      <select
          id="pColors"
          multiple
          style="width:100%; margin-bottom:15px;"
      >
          <option value="Black">Black</option>
          <option value="White">White</option>
          <option value="Blue">Blue</option>
          <option value="Red">Red</option>
          <option value="Green">Green</option>
      </select>

      <label for="pSizes">Sizes</label><br>

      <select
          id="pSizes"
          multiple
          style="width:100%; margin-bottom:15px;"
      >
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
      </select>

      <input type="file" id="pImage" name="imageUpload" accept="images/*" multiple>
      
      <div id="imageGallery"></div>
      
      <label for="pCategory">Category</label><br>
      <select id="pCategory" style="width: 100%; margin-bottom: 20px;">
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="home">Home</option>
        <option value="cosmetics">Cosmetics</option>
        <option value="plants">Plants</option>
        <option value="food">Food</option>
        <option value="other">Other</option>
      </select>

    <button
      type="button"
      id="generateAI"
      style="margin-bottom:15px;"
    >
          ✨ Generate with AI
    </button>

      <div id="productList"></div>

      <button type="submit" style="background-color: hsl(247, 91%, 67%); color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%;">
        Post to Marketplace
      </button>
    </form>

<script type="module" src="../js/app.js"></script>
</body>
</html>
