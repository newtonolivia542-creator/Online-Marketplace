<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lesovia.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - Lesovia</title>
  <link rel="stylesheet" href="../css/buyer dashboard.css?v=9">
  <link rel="stylesheet" href="../css/shop.css?v=2">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lesovia">
  <meta property="og:title" content="Shop on Lesovia">
  <meta property="og:description" content="Browse a seller's products and ratings on Lesovia.">
  <meta property="og:image" content="https://lesovia.com/images/lesovia-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop on Lesovia">
  <meta name="twitter:image" content="https://lesovia.com/images/lesovia-social.png">
  <link rel="icon" type="image/svg+xml" href="../images/lesovia-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/lesovia-favicon-32.png">
  <link rel="apple-touch-icon" href="../images/lesovia-touch-icon.png">
</head>
<body>

  <!-- ================= HEADER (same as the homepage) ================= -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="../images/lesovia-mark.svg" alt="Lesovia">
      <span class="logo-text">Lesovia</span>
    </a>

    <!-- Filled in by app.js: the signed-in person's name in the middle, and on the right
         Login / Register or their own links -->
    <div class="nav-center" id="shopWelcome"></div>
    <div class="nav-links" id="shopNav" style="visibility:hidden;"></div>
  </nav>

  <!-- ================= STORE BANNER ================= -->
  <section class="shop-banner">
    <div class="shop-banner-info">
      <h1 id="shopName">Loading shop...</h1>
      <p class="shop-rating-line" id="shopRating"></p>
      <p class="shop-description" id="shopDescription"></p>
    </div>

    <form class="shop-search" id="shopSearchForm" role="search" autocomplete="off">
      <input type="search" id="shopSearchInput" placeholder="Search this store" aria-label="Search this store">
      <button type="submit" class="shop-search-btn">Search</button>
    </form>
  </section>

  <div class="shop-toolbar">
    <a href="index.html" class="shop-back">&larr; Back to Lesovia</a>
    <span id="shopCount" class="shop-count"></span>
  </div>

  <div id="shopProductList" class="product-grid"></div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
